

<script type="module" src="/chat.js?&amp;v=2.1-dev"></script>
<figure class="chat_room" data-chat-room="chat" data-chat-config='{"url":"/","interval":60000,"audio":"/notification.mp3"}'>
  <figcaption>Chat room chat</figcaption>
  <ol class="chat_messages">
<!--START-->
    <li class="chat_message "><span class="chat_user">Somebody</span>: <span class="chat_text">hello</span></li>
    <li class="chat_message "><span class="chat_user">olape</span>: <span class="chat_text">world</span></li>
    <li class="chat_message chat_self"><span class="chat_user">I</span>: <span class="chat_text">'sup</span></li>
<!--END-->
  </ol>
  <form action="/" method="post">
    <input type="hidden" name="chat_token" value="0123456789ABCDEF">
    <p class="chat_message">
      <label>
        <span>Message</span>
        <span class="chat_help">(at most 160 characters; ENTER to submit)</span>
        <input type="text" name="chat_message" required maxlength="160">
      </label>
    </p>
    <script type="text/x-template">
      <p class="chat_volume">
        <label>
          <span>Volume</span>
          <input type="range" value="50" min="0" max="100">
        </label>
      </p>
    </script>
    <p class="chat_button">
      <button name="chat_room" value="chat">Send</button>
    </p>
  </form>
</figure>
