

<script type="module" src="/chat.js?&amp;v=2.1-dev"></script>
<figure class="chat_room" data-chat-room="chat" data-chat-config='{"url":"/","interval":60000,"audio":"/notification.mp3"}'>
  <figcaption>Chat room chat</figcaption>
  <ol class="chat_messages">
<!--START-->
    <li class="chat_message "><span class="chat_user">Somebody</span>: <span class="chat_text">hello</span></li>
    <li class="chat_message "><span class="chat_user">olape</span>: <span class="chat_text">world</span></li>
    <li class="chat_message "><span class="chat_user">cmb</span>: <span class="chat_text">'sup</span></li>
    <li class="chat_message "><span class="chat_user">Somebody</span>: <span class="chat_text">test</span></li>
<!--END-->
  </ol>
  <form action="/" method="post">
    <input type="hidden" name="chat_token" value="0123456789ABCDEF">
    <p class="chat_message">
      <label>
        <span>Message</span>
        <span class="chat_help">(at most 160 characters; ENTER to submit)</span>
        <input type="text" name="chat_message" required maxlength="160">
      </label>
    </p>
    <script type="text/x-template">
      <p class="chat_volume">
          <button type="button" data-volume="0.0" title="Notifications muted" hidden><svg xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true" height="2em" viewBox="0 -960 960 960" width="2em" fill="currentColor"><path d="M280-360v-240h160l200-200v640L440-360H280Z"/></svg></button>
          <button type="button" data-volume="0.5" title="Notifications low"><svg xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true" height="2em" viewBox="0 -960 960 960" width="2em" fill="currentColor"><path d="M200-360v-240h160l200-200v640L360-360H200Zm440 40v-322q45 21 72.5 65t27.5 97q0 53-27.5 96T640-320Z"/></svg></button>
          <button type="button" data-volume="1.0" title="Notifications loud" hidden><svg xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true" height="2em" viewBox="0 -960 960 960" width="2em" fill="currentColor"><path d="M560-131v-82q90-26 145-100t55-168q0-94-55-168T560-749v-82q124 28 202 125.5T840-481q0 127-78 224.5T560-131ZM120-360v-240h160l200-200v640L280-360H120Zm440 40v-322q47 22 73.5 66t26.5 96q0 51-26.5 94.5T560-320Z"/></svg></button>
      </p>
    </script>
    <p class="chat_button">
      <button name="chat_room" value="chat">Send</button>
    </p>
  </form>
</figure>
